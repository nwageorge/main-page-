<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ADLTrack - Global Care Connection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Plus Jakarta Sans for a modern geometric look similar to Google Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #000000;
        color: #ffffff;
        overflow-x: hidden;
      }
      
      /* Snap Yellow Utility (Legacy support) */
      .bg-snap { background-color: #FFFC00; }
      .text-snap { color: #FFFC00; }
      
      /* Hide scrollbar but keep functionality */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      /* Gemini Gradient Utilities */
      .bg-gemini {
        background: linear-gradient(120deg, #4285F4 0%, #9B72CB 50%, #D96570 100%);
      }
      .text-gemini {
        background: linear-gradient(120deg, #4285F4 0%, #9B72CB 50%, #D96570 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* --- GLOBE ANIMATIONS --- */
      @keyframes earthRotate {
        0% { background-position: 0 0; }
        100% { background-position: 400px 0; }
      }
      @keyframes twinkling { 0%,100% { opacity:0.1; } 50% { opacity:1; } }
      @keyframes twinkling-slow { 0%,100% { opacity:0.1; } 50% { opacity:1; } }
      @keyframes twinkling-long { 0%,100% { opacity:0.1; } 50% { opacity:1; } }
      @keyframes twinkling-fast { 0%,100% { opacity:0.1; } 50% { opacity:1; } }

      @keyframes fadeOutLabel {
        0% {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
        70% {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateX(0.5rem) scale(0.95);
        }
      }
      
      .animate-fadeOut {
        animation: fadeOutLabel 4s forwards;
      }
    </style>

    "@radix-ui/react-slot": "https://esm.sh/@radix-ui/react-slot@^1.2.4",
    "@radix-ui/react-tooltip": "https://esm.sh/@radix-ui/react-tooltip@^1.2.8",
    "@radix-ui/react-separator": "https://esm.sh/@radix-ui/react-separator@^1.1.8",
    "@radix-ui/react-dialog": "https://esm.sh/@radix-ui/react-dialog@^1.1.15",
    "@radix-ui/react-popover": "https://esm.sh/@radix-ui/react-popover@^1.1.1",
    "@radix-ui/react-slider": "https://esm.sh/@radix-ui/react-slider@^1.2.0",
    "framer-motion": "https://esm.sh/framer-motion@12.0.0-alpha.2",
    "motion/react": "https://esm.sh/framer-motion@12.0.0-alpha.2/react",
    "motion/": "https://esm.sh/motion@^12.24.2/",

</head>
